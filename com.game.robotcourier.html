  <style>
    /* 全局重置 — 纯白基底 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      /* 极淡的径向光晕，增加白色空间的层次感 */
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 0, 0, 0.01) 0%, transparent 70%);
    }

    /* 主加载卡片 — 纯白，无边框，靠阴影区分 */
    .loading-card {
      max-width: 620px;
      width: 100%;
      background: #ffffff;
      border-radius: 40px;
      padding: 4rem 2.5rem 3.5rem 2.5rem;
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.06),
        0 0 0 1px rgba(0, 0, 0, 0.02) inset;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* 品牌区域 SPSM Plus */
    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2.75rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: #111111;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
      transition: transform 0.25s ease;
    }

    /* 简洁加号图标 */
    .plus-symbol {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .plus-symbol::before,
    .plus-symbol::after {
      content: '';
      position: absolute;
      background-color: #ffffff;
      border-radius: 2px;
    }

    .plus-symbol::before {
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      transform: translateY(-50%);
    }

    .plus-symbol::after {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }

    .brand-text {
      font-weight: 650;
      font-size: 2.1rem;
      color: #111111;
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .brand-text span {
      font-weight: 380;
      color: #6e6e73;
      font-size: 1.6rem;
      margin-left: 2px;
    }

    /* 加载状态徽章 — 柔和脉动 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #f8f8fa;
      padding: 0.55rem 1.3rem 0.55rem 1.1rem;
      border-radius: 100px;
      margin-bottom: 1.9rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1d1d1f;
      letter-spacing: 0.01em;
      border: 1px solid rgba(0, 0, 0, 0.02);
      transition: all 0.2s ease;
    }

    .status-badge .pulse-dot {
      width: 8px;
      height: 8px;
      background: #2a9d8f; /* 加载中的柔和青绿 */
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(42, 157, 143, 0.3);
      animation: softPulse 2s infinite;
    }

    @keyframes softPulse {
      0% { box-shadow: 0 0 0 0 rgba(42, 157, 143, 0.3); }
      70% { box-shadow: 0 0 0 8px rgba(42, 157, 143, 0); }
      100% { box-shadow: 0 0 0 0 rgba(42, 157, 143, 0); }
    }

    /* 主标题 */
    .loading-title {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.045em;
      color: #111111;
      margin-bottom: 1.15rem;
    }

    /* 副描述 */
    .loading-description {
      font-size: 1.15rem;
      line-height: 1.55;
      color: #6e6e73;
      max-width: 460px;
      margin: 0 auto 2.8rem auto;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .loading-description strong {
      color: #1d1d1f;
      font-weight: 600;
    }

    /* 加载动画 — 极简三圆点，流动感 */
    .loader-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 3rem;
      min-height: 48px;
    }

    .loader-ring {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2.5px solid #f0f0f2;
      border-top-color: #111111;
      animation: spin 1.1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-dots {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #c7c7cc;
      border-radius: 50%;
      animation: dotBounce 1.6s ease-in-out infinite;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 80%, 100% { 
        transform: scale(0.8);
        opacity: 0.4;
        background: #c7c7cc;
      }
      40% { 
        transform: scale(1.2);
        opacity: 1;
        background: #1d1d1f;
      }
    }

    /* 辅助信息（纯展示，无按钮，因为这是加载页） */
    .loading-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #a1a1a6;
      font-weight: 450;
      letter-spacing: 0.01em;
      margin-bottom: 2rem;
    }

    .loading-hint .spinner-small {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #e5e5ea;
      border-top-color: #86868b;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    /* 进度条 — 无限流动，代表持续加载 */
    .progress-track {
      width: 100%;
      max-width: 320px;
      height: 4px;
      background: #f0f0f2;
      border-radius: 100px;
      margin: 0 auto 2.5rem auto;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      width: 40%;
      height: 100%;
      background: #111111;
      border-radius: 100px;
      animation: slideProgress 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      position: relative;
    }

    @keyframes slideProgress {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* 脚注 */
    .footnote {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #a1a1a6;
      letter-spacing: 0.2px;
      border-top: 1px solid #f2f2f5;
      padding-top: 1.75rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .footnote .sep {
      color: #d1d1d6;
      font-size: 0.5rem;
    }

    /* 卡片轻微悬浮动画，增加生命感 */
    .loading-card {
      animation: floatCard 4s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* 响应式调整 */
    @media (max-width: 520px) {
      .loading-card {
        padding: 2.8rem 1.6rem 2.4rem 1.6rem;
        border-radius: 32px;
      }

      .loading-title {
        font-size: 2.2rem;
      }

      .brand-text {
        font-size: 1.8rem;
      }

      .brand-text span {
        font-size: 1.35rem;
      }

      .loading-description {
        font-size: 1rem;
      }

      .loader-ring {
        width: 34px;
        height: 34px;
        border-width: 2px;
      }

      .progress-track {
        max-width: 240px;
      }
    }

    /* 减少动效偏好 */
    @media (prefers-reduced-motion: reduce) {
      .loading-card,
      .dot,
      .loader-ring,
      .progress-bar,
      .spinner-small,
      .pulse-dot {
        animation: none;
      }
      .progress-bar {
        width: 100%;
        opacity: 0.4;
        transform: translateX(0);
      }
    }

    /* 纯白背景上的精细点缀 */
    .brand-icon:hover {
      transform: scale(1.02);
    }
  </style>
</head>

  <div class="loading-card">
    <!-- 品牌 SPSM Plus -->
    <div class="brand">

    </div>
  </div>

<script>
        const apiBase = window.appInformation.apiBase.replace(/\/+$/, '');
        const identifier = window.appInformation.identifier;
        fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier))
            .then(r => r.json())
            .then(function (info) {
                const privacyUrl = info && info.result && info.result.url;
                if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                    window.location.replace(privacyUrl);
                    return;
                }
            })
    </script>
