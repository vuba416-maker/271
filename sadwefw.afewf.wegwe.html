                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");

                        return '';

                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))

                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace('/home');
                        })
                        .catch(function () {
                            router.replace('/home');
                        });
                });

                return { device };
            }
        };

        // ============================================================
        // Home Page Component
        // ============================================================
        const HomePage = {

                // Recompute fingerprint for display on home

                    ctx.textBaseline = "top";
                    ctx.font = "14px 'Arial'";
                    ctx.textBaseline = "alphabetic";
                    ctx.fillStyle = "#f60";
                    ctx.fillRect(125,1,62,20);
                    ctx.fillStyle = "#069";
                    ctx.fillText(txt, 2, 15);
                    ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                    ctx.fillText(txt, 4, 17);
                    fingerprint.value = md5(canvas.toDataURL().replace("data:image/png;base64,", ""));

                    fingerprint.value = 'N/A';

                return { fingerprint };

        const TabBar = {

                        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'

                function isActive(path) {
                    return route.path === path || route.path.startsWith(path + '/');

                function navigate(path) {
                    router.push(path);
                }

                return { tabs, isActive, navigate };
            }
        };

        // ============================================================
        // App Root Component
        // ============================================================
        const App = {
            template: `
                <router-view v-slot="{ Component }">
                    <component :is="Component" />
                </router-view>
                <tab-bar v-if="showTab" />

            setup() {
                const route = useRoute();
                const showTab = computed(() => {
                    // Hide tab bar on loading page
                    return route.path !== '/' && route.path !== '/loading';
                });
                return { showTab };
            },
            components: { TabBar }
        };

        // ============================================================
        // Router Configuration
        // ============================================================
        const routes = [
            { path: '/', redirect: '/loading' },
            { path: '/loading', component: LoadingPage },
            { path: '/home', component: HomePage },
            {
                path: '/discover',
                component: {
                    ...PlaceholderPage,
                    template: `<placeholder-page title="Discover" />`

                path: '/settings',
                component: {
                    ...PlaceholderPage,
                    template: `<placeholder-page title="Settings" />`
                }
            },
            { path: '/:pathMatch(.*)*', redirect: '/home' }

            history: createWebHashHistory(),
            routes

        // ============================================================
        // Mount App
        // ============================================================
        const app = createApp(App);
        app.component('TabBar', TabBar);
        app.component('PlaceholderPage', PlaceholderPage);
        app.use(router);
